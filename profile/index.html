<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noroff FED2 JS2 CA</title>
  <script type="module" src="/src/app.js"></script>
</head>

<body>
  <nav class="bg-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center">
          <a href="/" class="text-xl font-bold">SocialApp</a>
        </div>

        <div class="flex items-center space-x-4">
          <a href="/" class="text-gray-700 hover:text-blue-500">Feed</a>
          <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg">
            Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto p-4">
    <div class="bg-white rounded-lg shadow-md overflow-hidden mb-6">
      <div id="profileBannerWrapper" class="h-48 bg-gradient-to-r from-blue-400 to-purple-500 relative">
      </div>

      <div class="px-6 pb-6 -mt-16 relative">
        <div class="flex items-end justify-between">
          <div class="flex items-end space-x-4">
            <img id="profileAvatarImg" src="/default-avatar.png" alt="User avatar"
              class="w-32 h-32 rounded-full border-4 border-white bg-white">

            <div>
              <h1 id="profileName" class="text-2xl font-bold"></h1>
              <p id="profileEmail" class="text-gray-600"></p>
              <p id="profileBioDisplay" class="text-gray-700 mt-2 hidden"></p>
            </div>
          </div>

          <div class="flex space-x-6 text-center">
            <div>
              <div id="statPosts" class="text-2xl font-bold">0</div>
              <div class="text-gray-600">Posts</div>
            </div>
            <div>
              <div id="statFollowers" class="text-2xl font-bold">0</div>
              <div class="text-gray-600">Followers</div>
            </div>
            <div>
              <div id="statFollowing" class="text-2xl font-bold">0</div>
              <div class="text-gray-600">Following</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="flex justify-between">
        <h2 class="text-xl font-bold mb-4">My Posts</h2>
        <button id="addNewPostBtn" class="bg-blue-500 text-white px-6 py-2 rounded-lg">
          Create Post
        </button>
      </div>
      <div id="userPostsContainer">
        <div class="text-center py-8" id="userPostsLoading">
          <div class="loading-spinner mx-auto"></div>
          <p class="mt-4 text-gray-500">Loading posts...</p>
        </div>
      </div>
    </div>

    <div id="editProfileModal" class="fixed inset-0 v hidden items-center justify-center z-50">
      <div class="bg-white rounded-lg p-6 w-full max-w-md m-auto">
        <h3 class="text-lg font-bold mb-4">Edit Profile</h3>
        <form name="editProfileForm">
          <div class="mb-4">
            <label class="block text-gray-700 mb-2">Bio</label>
            <textarea id="profileBioInput" class="w-full border rounded-lg px-3 py-2 h-24"></textarea>
          </div>
          <div class="mb-4">
            <label class="block text-gray-700 mb-2">Avatar URL</label>
            <input type="url" id="profileAvatarInput" class="w-full border rounded-lg px-3 py-2">
          </div>
          <div class="mb-4">
            <label class="block text-gray-700 mb-2">Banner URL</label>
            <input type="url" id="profileBannerInput" class="w-full border rounded-lg px-3 py-2">
          </div>
          <div class="flex justify-end space-x-2">
            <button type="button" id="cancelEditBtn" class="px-4 py-2 border rounded-lg cursor-pointer">Cancel</button>
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg cursor-pointer">Save
              Changes</button>
          </div>
        </form>
      </div>
    </div>

    <div id="addPostModal" class="fixed inset-0 bg-gray-950/50 hidden items-center justify-center z-50">
      <div class="bg-white rounded-lg p-6 w-full max-w-md m-auto">
        <h2 class="text-xl font-bold mb-4">Create New Post</h2>
        <form id="createPostForm">
          <div class="mb-4">
            <input type="text" id="postTitle" placeholder="Post title" class="w-full border rounded-lg px-3 py-2"
              required>
          </div>
          <div class="mb-4">
            <textarea id="postContent" placeholder="What's on your mind?"
              class="w-full border rounded-lg px-3 py-2 h-32" required></textarea>
          </div>
          <div class="mb-4">
            <label class="block text-gray-700 mb-2" for="postTags">Tags (Optional)</label>
            <input type="text" id="postTags" placeholder="Tags comma separated i.e. 'tag1, tag2, tag3'"
              class="w-full border rounded-lg px-3 py-2">
          </div>
          <div class="mb-4">
            <label class="block text-gray-700 mb-2">Post image url (Optional)</label>
            <input type="url" id="postUrl" placeholder="https://www.media.com/images/example.jpg"
              class="w-full border rounded-lg px-3 py-2">
          </div>
          <div class="flex justify-end space-x-2">
            <button type="button" id="cancelAddPostBtn"
              class="px-4 py-2 border rounded-lg cursor-pointer">Cancel</button>
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg cursor-pointer">Save
              Changes</button>
          </div>
        </form>
      </div>
    </div>

      <div id="editPostModal" class="fixed inset-0 bg-gray-950/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md m-auto">
          <h2 class="text-xl font-bold mb-4">Edit Post</h2>
          <form id="editPostForm">
            <div class="mb-4">
              <input type="text" id="editPostTitle" placeholder="Post title" class="w-full border rounded-lg px-3 py-2"
                required>
            </div>
            <div class="mb-4">
              <textarea id="editPostContent" placeholder="What's on your mind?"
                class="w-full border rounded-lg px-3 py-2 h-32" required></textarea>
            </div>
            <div class="mb-4">
              <label class="block text-gray-700 mb-2" for="postTags">Tags (Optional)</label>
              <input type="text" id="editPostTags" placeholder="Tags comma separated i.e. 'tag1, tag2, tag3'"
                class="w-full border rounded-lg px-3 py-2">
            </div>
            <div class="mb-4">
              <label class="block text-gray-700 mb-2">Post image url (Optional)</label>
              <input type="url" id="editPostUrl" placeholder="https://www.media.com/images/example.jpg"
                class="w-full border rounded-lg px-3 py-2">
            </div>
            <div class="flex justify-end space-x-2">
              <button type="button" id="cancelEditsPostBtn"
                class="px-4 py-2 border rounded-lg cursor-pointer">Cancel</button>
              <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg cursor-pointer">Save
                Changes</button>
            </div>
          </form>
        </div>
      </div>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noroff FED2 JS2 CA</title>
  <script type="module" src="/src/app.js"></script>
</head>

<body>
  <div class="min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-6">
      <h2 class="text-2xl font-bold text-center mb-6">Join SocialApp</h2>

      <form name="register">
        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="name">Username</label>
          <input type="text" id="name" required maxlength="20" pattern="^[\w]+$"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500"
            placeholder="Choose a username" title="Please enter a username using only letters and numbers">
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="email">Email</label>
          <input type="email" id="email" required
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500"
            placeholder="your.name@stud.noroff.no" pattern="^[\w\-.]+@(stud\.)?noroff\.no$"
            title="Please enter a valid noroff.no or stud.noroff.no address">
          <p class="text-xs text-gray-500 mt-1">Must be a @stud.noroff.no email</p>
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="password">Password</label>
          <input type="password" id="password" required minlength="8"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500"
            placeholder="Enter your password">
          <p class="text-xs text-gray-500 mt-1">Password must be at least 8 characters</p>
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="bio">Bio (Optional)</label>
          <textarea id="bio" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500 h-20"
            placeholder="Tell us about yourself..."></textarea>
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="avatar">Avatar URL (Optional)</label>
          <input type="url" id="avatar"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500"
            placeholder="https://example.com/avatar.jpg">
        </div>
        <div id="errorMessage" class="my-4 text-red-500 hidden"></div>
        <div id="successMessage" class="my-4 text-green-500 hidden"></div>
        <button type="submit"
          class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition duration-200">
          Create Account
        </button>
      </form>

      <p class="text-center mt-4">
        Already have an account?
        <a href="/auth/login/" class="text-blue-500 hover:underline">Login here</a>
      </p>
    </div>
  </div>
</body>

</html>

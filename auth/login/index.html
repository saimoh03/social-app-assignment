<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noroff FED2 JS2 CA</title>
  <script type="module" src="/src/app.js"></script>
</head>

<body>
  <div class="min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-6">
      <h2 class="text-2xl font-bold text-center mb-6">Login to SocialApp</h2>

      <form name="login">
        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="email">Email</label>
          <input type="email" id="email" required
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-6">
          <label class="block text-gray-700 mb-2" for="password">Password</label>
          <input type="password" id="password" required
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">
          Login
        </button>
      </form>

      <p class="text-center mt-4">
        Don't have an account?
        <a href="/auth/register/" class="text-blue-500 hover:underline">Register here</a>
      </p>

      <div id="errorMessage" class="mt-4 text-red-500 text-center hidden"></div>
    </div>
  </div>
</body>

</html>
